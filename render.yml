services:
  - type: web
    name: traffic-simulation-api
    env: python
    region: frankfurt
    buildCommand: |
      pip install -r requirements.txt
      python -c "import matplotlib; matplotlib.use('Agg')"
    startCommand: gunicorn server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: server.py
    healthCheckPath: /health
    autoDeploy: true
