services:
  - type: web
    name: traffic-simulation-api
    env: python
    region: frankfurt # Avrupa sunucusu için
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: server.py
      - key: PORT
        value: 5000
    healthCheckPath: /health
    autoDeploy: true
